name: SF - Salesforce API (Issue request)

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: sf-api-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sf-request:
    if: >-
      contains(fromJSON('["jimmytobing","098595","bfipbf"]'), github.actor) &&
      contains(fromJSON('["jimmytobing","098595","bfipbf"]'), github.event.issue.user.login) &&
      contains(github.event.issue.body, '### Sf Request')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SF_CLIENT_ID: ${{ secrets.SF_BFI_PROD_CLIENT_ID || secrets.SF_CLIENT_ID }}
      SF_CLIENT_SECRET: ${{ secrets.SF_BFI_PROD_CLIENT_SECRET || secrets.SF_CLIENT_SECRET }}
      SF_BFI_PROD_LOGIN_URL: ${{ vars.SF_BFI_PROD_LOGIN_URL }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      PRIVATE_PBF_TOKEN: ${{ secrets.PRIVATE_PBF_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify exact Sf Request heading
        id: route
        shell: bash
        run: |
          if printf '%s\n' "$ISSUE_BODY" | grep -Eq '^### Sf Request[[:space:]]*$'; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            echo 'valid=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Run Salesforce issue request and prepare collapsible evidence
        id: jim
        if: steps.route.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node .github/mjs/sf-request.mjs
      - name: Publish Sf Request evidence to linked PRIVATE-PBF Issue only
        if: always() && steps.route.outputs.valid == 'true' && steps.jim.outcome != 'skipped'
        env:
          EVIDENCE_FILE: ${{ runner.temp }}/sf-request-comment.md
          EVIDENCE_KIND: sf-request
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/mjs/publish-jim-private.mjs

  sf-bash:
    if: >-
      contains(fromJSON('["jimmytobing","098595","bfipbf"]'), github.actor) &&
      contains(fromJSON('["jimmytobing","098595","bfipbf"]'), github.event.issue.user.login) &&
      contains(github.event.issue.body, '### Sf Bash')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BASH_HEADING: Sf Bash
    steps:
      - name: Checkout without stored Git credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check exact Sf Bash heading
        id: route
        shell: bash
        run: |
          if printf '%s\n' "$ISSUE_BODY" | grep -Eq '^### Sf Bash[[:space:]]*$'; then
            echo 'valid=true' >> "$GITHUB_OUTPUT"
          else
            echo 'valid=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Salesforce CLI from official compressed TAR (no npm/cache)
        id: install
        if: steps.route.outputs.valid == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CLI_DIR="$RUNNER_TEMP/wde-sf-cli"
          CLI_TAR="$RUNNER_TEMP/sf-linux-x64.tar.xz"
          mkdir -p "$CLI_DIR"
          # Salesforce's versioned installer (official release 2.159.5).
          CLI_URL="https://developer.salesforce.com/media/salesforce-cli/sf/versions/2.159.5/9d74d04/sf-v2.159.5-9d74d04-linux-x64.tar.xz"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 90 "$CLI_URL" -o "$CLI_TAR"
          tar -xJf "$CLI_TAR" -C "$CLI_DIR" --strip-components 1
          rm -f "$CLI_TAR"
          echo "$CLI_DIR/bin" >> "$GITHUB_PATH"
          "$CLI_DIR/bin/sf" --version
      - name: Authenticate Salesforce CLI to configured Salesforce instance
        id: auth
        if: steps.route.outputs.valid == 'true'
        shell: bash
        env:
          SF_BFI_PROD_LOGIN_URL: ${{ vars.SF_BFI_PROD_LOGIN_URL }}
          SF_CLIENT_ID: ${{ secrets.SF_BFI_PROD_CLIENT_ID || secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_BFI_PROD_CLIENT_SECRET || secrets.SF_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          node .github/mjs/sf-bash-auth.mjs
      - name: Execute isolated Sf Bash
        id: bash
        if: steps.route.outputs.valid == 'true'
        shell: bash
        run: node .github/mjs/sf-bash.mjs
      - name: Prepare Sf Bash failure evidence if execution did not start
        if: always() && steps.route.outputs.valid == 'true'
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          BASH_OUTCOME: ${{ steps.bash.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/sf-bash-comment.md"
          if [[ ! -s "$FILE" ]]; then
            {
              echo "## Sf Bash — Issue #$ISSUE_NUMBER"
              echo
              echo "Status: **FAILED before Bash result**"
              echo
              echo "cli_install=$INSTALL_OUTCOME; auth=$AUTH_OUTCOME; execution=$BASH_OUTCOME"
              echo
              echo "See GitHub Actions job logs for the failed prerequisite. No Salesforce success is claimed."
            } > "$FILE"
          fi
      - name: Upload Sf Bash evidence
        if: always() && steps.route.outputs.valid == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sf-bash-${{ github.run_id }}
          path: ${{ runner.temp }}/sf-bash-comment.md
          if-no-files-found: error
          retention-days: 1

  publish-sf-bash:
    needs: sf-bash
    if: always() && needs.sf-bash.result != 'skipped'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download Sf Bash evidence
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4
        with:
          name: sf-bash-${{ github.run_id }}
          path: ${{ runner.temp }}/sf-bash-result
      - name: Checkout trusted private evidence publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish Sf Bash evidence to linked PRIVATE-PBF Issue only
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PRIVATE_PBF_TOKEN: ${{ secrets.PRIVATE_PBF_TOKEN }}
          EVIDENCE_FILE: ${{ runner.temp }}/sf-bash-result/sf-bash-comment.md
          EVIDENCE_KIND: sf-bash
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail
          node .github/mjs/publish-jim-private.mjs

  sf-deploy:
    if: >-
      github.repository == 'bfipbf/SILENT-PBF' &&
      contains(fromJSON('["jimmytobing","098595","bfipbf"]'), github.actor) &&
      contains(fromJSON('["jimmytobing","098595","bfipbf"]'), github.event.issue.user.login) &&
      contains(github.event.issue.body, '### Sf Deploy')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
      SF_BFI_PROD_LOGIN_URL: ${{ vars.SF_BFI_PROD_LOGIN_URL }}
      CANDIDATE_DIR: ${{ github.workspace }}/candidate
    steps:
      - name: Checkout trusted gateway code (no persisted Git credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: trusted
      - name: Strict Sf Deploy request and actor preflight
        id: route
        shell: bash
        run: node trusted/.github/mjs/sf-bash.mjs preflight
      - name: Checkout immutable candidate SHA without persisted credentials
        if: steps.route.outcome == 'success'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.route.outputs.sha }}
          persist-credentials: false
          path: candidate
      - name: Inspect candidate manifest and destructive changes files
        id: inspect
        if: steps.route.outcome == 'success'
        shell: bash
        run: node trusted/.github/mjs/sf-bash.mjs inspect
      - name: Install official Salesforce CLI (no npm)
        id: install
        if: steps.inspect.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          CLI_DIR="$RUNNER_TEMP/wde-sf-cli"
          CLI_TAR="$RUNNER_TEMP/sf-linux-x64.tar.xz"
          mkdir -p "$CLI_DIR"
          CLI_URL="https://developer.salesforce.com/media/salesforce-cli/sf/versions/2.159.5/9d74d04/sf-v2.159.5-9d74d04-linux-x64.tar.xz"
          curl --fail --silent --show-error --location --retry 2 --connect-timeout 10 --max-time 90 "$CLI_URL" -o "$CLI_TAR"
          tar -xJf "$CLI_TAR" -C "$CLI_DIR" --strip-components 1
          rm -f "$CLI_TAR"
          echo "$CLI_DIR/bin" >> "$GITHUB_PATH"
          "$CLI_DIR/bin/sf" --version
      - name: Authenticate CLI using trusted gateway script
        id: auth
        if: steps.install.outcome == 'success'
        shell: bash
        env:
          SF_CLIENT_ID: ${{ secrets.SF_BFI_PROD_CLIENT_ID || secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_BFI_PROD_CLIENT_SECRET || secrets.SF_CLIENT_SECRET }}
        run: node trusted/.github/mjs/sf-bash-auth.mjs
      - name: Execute requested Salesforce validate/deploy
        id: execute
        if: steps.auth.outcome == 'success'
        shell: bash
        run: node trusted/.github/mjs/sf-bash.mjs run
      - name: Prepare evidence if CLI or checkout failed before execution
        if: always()
        shell: bash
        env:
          ROUTE_OUTCOME: ${{ steps.route.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
          EXECUTE_OUTCOME: ${{ steps.execute.outcome }}
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/sf-deploy-comment.md"
          if [[ ! -s "$FILE" ]]; then
            {
              echo "## Sf Deploy — Issue $ISSUE_NUMBER"
              echo
              echo "Status: **FAILED before Salesforce result**"
              echo
              echo "preflight=$ROUTE_OUTCOME; inspect=$INSPECT_OUTCOME; cli_install=$INSTALL_OUTCOME; auth=$AUTH_OUTCOME; execute=$EXECUTE_OUTCOME"
              echo
              echo "See job logs. No Salesforce deployment success is claimed."
            } > "$FILE"
          fi
      - name: Upload sanitized Sf Deploy evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sf-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/sf-deploy-comment.md
          if-no-files-found: warn
          retention-days: 1

  publish-sf-deploy:
    needs: sf-deploy
    if: always() && needs.sf-deploy.result != 'skipped'
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download Sf Deploy evidence
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4
        with:
          name: sf-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/sf-deploy-result
      - name: Checkout trusted publisher
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Publish Sf Deploy evidence to linked PRIVATE-PBF Issue only
        shell: bash
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PRIVATE_PBF_TOKEN: ${{ secrets.PRIVATE_PBF_TOKEN }}
          EVIDENCE_FILE: ${{ runner.temp }}/sf-deploy-result/sf-deploy-comment.md
          EVIDENCE_KIND: sf-deploy
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          node .github/mjs/publish-jim-private.mjs